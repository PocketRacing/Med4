<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>MED SHIFT — REMAKE 1.0</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0
}

body{
    background:#060b13;
    color:#edf5ff;
    font:15px Arial,sans-serif;
    min-height:100vh
}

button,input{
    font:inherit
}

button{
    cursor:pointer
}

.login{
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:20px;
    background:
        radial-gradient(circle at 50% 0,#123052,transparent 45%),
        #060b13
}

.loginbox{
    width:min(650px,100%);
    padding:30px;
    border:1px solid #263b53;
    border-radius:25px;
    background:#0d1826;
    box-shadow:0 25px 80px #0008
}

.logo{
    display:flex;
    gap:15px;
    align-items:center;
    margin-bottom:22px
}

.logoicon{
    font-size:42px;
    width:70px;
    height:70px;
    display:grid;
    place-items:center;
    border-radius:20px;
    background:linear-gradient(135deg,#197bd0,#31c9c0)
}

h1{
    font-size:30px
}

.muted{
    color:#8192a7;
    line-height:1.5
}

.name{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:1px solid #2a4059;
    background:#07111d;
    color:#fff;
    outline:0;
    margin:20px 0 10px
}

.primary,
.btn{
    padding:12px 15px;
    border:1px solid #2c4662;
    border-radius:12px;
    background:#14263a;
    color:#fff
}

.primary{
    width:100%;
    background:linear-gradient(135deg,#238ceb,#31c7bf);
    font-weight:bold
}

.shell{
    min-height:100vh;
    display:grid;
    grid-template-columns:235px 1fr
}

.side{
    position:sticky;
    top:0;
    height:100vh;
    padding:18px;
    background:#08111c;
    border-right:1px solid #22344a
}

.brand{
    font-weight:bold;
    font-size:18px;
    padding:8px 5px 22px
}

.brand small{
    display:block;
    color:#71839a;
    font-size:11px;
    margin-top:4px
}

.nav{
    display:grid;
    gap:7px
}

.nav button{
    padding:12px;
    text-align:left;
    border:0;
    border-radius:11px;
    background:transparent;
    color:#a8b9ce
}

.nav button.active,
.nav button:hover{
    background:#14263b;
    color:#fff
}

.mini{
    position:absolute;
    bottom:18px;
    left:18px;
    right:18px;
    padding:12px;
    border-radius:13px;
    background:#0e1b2a;
    border:1px solid #243850
}

.main{
    padding:20px;
    min-width:0
}

.top{
    display:flex;
    justify-content:space-between;
    gap:15px;
    align-items:center;
    margin-bottom:18px
}

.top h2{
    font-size:24px
}

.stats{
    display:flex;
    gap:7px;
    flex-wrap:wrap
}

.stat{
    padding:9px 12px;
    background:#0d1927;
    border:1px solid #243850;
    border-radius:11px
}

.stat small{
    display:block;
    color:#71839a;
    font-size:10px
}

.card{
    background:linear-gradient(145deg,#101d2d,#09121e);
    border:1px solid #263a52;
    border-radius:17px;
    padding:17px
}

.hero{
    padding:24px;
    border-radius:20px;
    border:1px solid #315778;
    background:linear-gradient(135deg,#123253,#0d1b2a);
    margin-bottom:15px
}

.hero h2{
    font-size:28px
}

.grid{
    display:grid;
    gap:14px
}

.g2{
    grid-template-columns:repeat(2,minmax(0,1fr))
}

.g3{
    grid-template-columns:repeat(3,minmax(0,1fr))
}

.title{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:center;
    margin-bottom:13px
}

.tag{
    display:inline-block;
    padding:5px 9px;
    border-radius:99px;
    background:#16263a;
    color:#9eb2ca;
    border:1px solid #29415d;
    font-size:11px
}

.red{
    background:#32171d;
    color:#ff8b94;
    border-color:#643039
}

.yellow{
    background:#332b13;
    color:#ffdb72;
    border-color:#655727
}

.green{
    background:#122a1d;
    color:#7ce5a2;
    border-color:#2a6142
}

.queue{
    display:grid;
    gap:9px
}

.patient{
    width:100%;
    display:grid;
    grid-template-columns:46px 1fr auto;
    gap:11px;
    align-items:center;
    text-align:left;
    padding:12px;
    background:#0a1522;
    color:#fff;
    border:1px solid #263a52;
    border-radius:13px
}

.patient:hover{
    background:#102033
}

.avatar{
    width:45px;
    height:45px;
    border-radius:12px;
    display:grid;
    place-items:center;
    background:#172a41;
    font-size:22px
}

.patient small{
    color:#7e90a7
}

.prio{
    padding:6px 8px;
    border-radius:8px;
    font-size:11px;
    font-weight:bold
}

.p1{
    background:#47171e;
    color:#ff8790
}

.p2{
    background:#493313;
    color:#ffdb72
}

.p3{
    background:#173a28;
    color:#7ce5a2
}

.vitals{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px
}

.vital{
    padding:11px;
    background:#08131f;
    border:1px solid #22364e;
    border-radius:11px
}

.vital small{
    color:#778ba3
}

.vital b{
    display:block;
    margin-top:5px;
    font-size:17px
}

.danger b{
    color:#ff6873
}

.warn b{
    color:#ffd75e
}

.section{
    margin-top:17px
}

.section h4{
    margin-bottom:9px;
    color:#bdccdc
}

.list{
    display:grid;
    gap:7px
}

.question,
.choice,
.diag{
    width:100%;
    padding:11px;
    text-align:left;
    border:1px solid #263b54;
    border-radius:11px;
    background:#0b1724;
    color:#d7e3ef
}

.question:hover,
.choice:hover,
.diag:hover{
    border-color:#4387bc
}

.question:disabled{
    opacity:.5
}

.actions{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:7px
}

.log{
    height:260px;
    overflow:auto;
    display:grid;
    align-content:start;
    gap:6px
}

.log div{
    padding:9px;
    border-left:3px solid #31516e;
    background:#091420;
    border-radius:8px;
    color:#aebed0;
    font-size:12px
}

.log .good{
    border-color:#45cf7b
}

.log .bad{
    border-color:#ff626d
}

.diagnoses{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px
}

.diag.selected{
    border-color:#3de0d4;
    background:#103335
}

.result{
    padding:11px;
    margin-bottom:7px;
    border:1px solid #243950;
    border-radius:11px;
    background:#091420
}

.result strong{
    display:block;
    margin-bottom:4px
}

.result span{
    color:#a7b8cb;
    line-height:1.45
}

.steps{
    display:flex;
    gap:5px;
    overflow:auto;
    margin-bottom:14px
}

.step{
    min-width:90px;
    flex:1;
    padding:9px;
    text-align:center;
    border-radius:9px;
    background:#08131f;
    border:1px solid #23374e;
    color:#71849c;
    font-size:11px
}

.step.current{
    background:#102b40;
    color:#fff;
    border-color:#3989c5
}

.step.done{
    color:#7be3a0;
    border-color:#2e6646
}

.modal{
    position:fixed;
    inset:0;
    background:#000b;
    display:none;
    place-items:center;
    padding:18px;
    z-index:50
}

.modal.show{
    display:grid
}

.modalbox{
    width:min(700px,100%);
    max-height:90vh;
    overflow:auto;
    padding:20px;
    background:#0d1826;
    border:1px solid #334a64;
    border-radius:20px
}

.modalhead{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px
}

.close{
    width:35px;
    height:35px;
    border:0;
    border-radius:9px;
    background:#18293c;
    color:#fff;
    font-size:20px
}

.toast{
    position:fixed;
    right:18px;
    bottom:18px;
    z-index:100;
    padding:13px 15px;
    border:1px solid #38506b;
    border-radius:12px;
    background:#101e2e;
    transform:translateY(120px);
    opacity:0;
    transition:.25s
}

.toast.show{
    transform:none;
    opacity:1
}

@media(max-width:900px){

    .shell{
        grid-template-columns:1fr
    }

    .side{
        position:fixed;
        z-index:40;
        top:auto;
        bottom:0;
        width:100%;
        height:auto;
        padding:7px;
        border-right:0;
        border-top:1px solid #24364b
    }

    .brand,
    .mini{
        display:none
    }

    .nav{
        grid-template-columns:repeat(5,1fr)
    }

    .nav button{
        text-align:center;
        font-size:11px;
        padding:9px 3px
    }

    .main{
        padding:13px 13px 82px
    }

    .g2,
    .g3{
        grid-template-columns:1fr
    }

    .top{
        align-items:flex-start;
        flex-direction:column
    }
}

@media(max-width:600px){

    .loginbox{
        padding:22px
    }

    .top h2{
        font-size:21px
    }

    .hero h2{
        font-size:23px
    }

    .vitals{
        grid-template-columns:repeat(2,1fr)
    }

    .actions,
    .diagnoses{
        grid-template-columns:1fr
    }

    .patient{
        grid-template-columns:43px 1fr
    }

    .patient .prio{
        grid-column:2;
        justify-self:start
    }
}
</style>
</head>

let state={
    name:'',
    profession:'feldsher',
    level:1,
    xp:0,
    money:0,
    rep:100,
    screen:'dashboard',
    current:null,
    queue:[],
    music:false,

    shift:{
        active:false,
        minute:0,
        max:480,
        patients:0,
        successful:0,
        mistakes:0
    },

    stats:{
        examinations:0,
        blood:0,
        swabs:0,
        ecg:0,
        xray:0,
        ultrasound:0,
        bandages:0,
        diagnoses:0,
        emergencies:0
    }
};

function load(){

    try{

        const x=JSON.parse(
            localStorage.getItem(SAVE)
        );

        if(x){
            state=Object.assign(state,x);
        }

    }catch(e){

        console.warn(e);

    }
}

function save(){

    localStorage.setItem(
        SAVE,
        JSON.stringify(state)
    );
}

function uid(){

    return Math.random()
        .toString(36)
        .slice(2)+Date.now();
}

function need(){

    return 100+(state.level-1)*75;
}

function xp(n){

    state.xp+=n;

    while(state.xp>=need()){

        state.xp-=need();

        state.level++;

        toast(
            'Новый уровень: '+state.level+' ⭐'
        );
    }

    save();
}

function toast(text){

    const e=$('toast');

    e.textContent=text;

    e.classList.add('show');

    clearTimeout(window.tt);

    window.tt=setTimeout(
        ()=>e.classList.remove('show'),
        2600
    );
}

function esc(s){

    return String(s)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;');
}

function openModal(title,body){

    $('modalTitle').textContent=title;

    $('modalBody').innerHTML=body;

    $('modal').classList.add('show');
}

function closeModal(){

    $('modal').classList.remove('show');
}

function dept(id){

    return departments[id]||id;
}

function formatTime(){

    const h=Math.floor(
        state.shift.minute/60
    );

    const m=state.shift.minute%60;

    return String(h).padStart(2,'0')+
        ':'+
        String(m).padStart(2,'0');
}

function advance(n){

    if(!state.shift.active){
        return;
    }

    state.shift.minute=
        Math.min(
            state.shift.max,
            state.shift.minute+n
        );

    state.queue.forEach(p=>{

        if(
            (p.status==='waiting'||
             p.status==='critical')&&
            p.p===1
        ){

            p.wait=(p.wait||0)+1;

            if(p.wait>=5){

                p.status='critical';

            }

        }

    });

    save();
}

function makePatient(c){

    return{

        uid:uid(),

        caseId:c.id,

        name:c.name,
        age:c.age,
        sex:c.sex,
        icon:c.icon,

        p:c.p,
        dep:c.dep,

        complaint:c.complaint,

        diag:c.diag,
        alts:[...c.alts],

        v:{...c.v},

        h:[...c.h],
        e:[...c.e],
        t:{...c.t},

        asked:[],
        exam:[],

        results:{},

        proc:null,

        procedureDone:{},

        triage:null,
        suspect:null,
        dest:null,

        status:'waiting',

        errors:0,
        wait:0,

        log:[]
    };
}

function startShift(){

    if(state.shift.active){

        return toast(
            'Смена уже идёт'
        );
    }

    state.queue=
        [...cases]
        .sort(()=>Math.random()-.5)
        .slice(0,6)
        .map(makePatient)
        .sort((a,b)=>a.p-b.p);

    state.shift={
        active:true,
        minute:0,
        max:480,
        patients:0,
        successful:0,
        mistakes:0
    };

    state.screen='queue';

    save();

    render();

    toast(
        'Смена началась'
    );
}

function endShift(){

    if(!state.shift.active){
        return;
    }

    const s=state.shift;

    const prof=
        professions[state.profession];

    const pay=Math.max(
        0,
        prof.salary+
        s.successful*75-
        s.mistakes*35
    );

    state.money+=pay;

    state.shift.active=false;

    save();

    openModal(
        'Смена завершена',

        `
        <div class="grid g2">

            <div class="result">
                <strong>Пациентов</strong>
                <span>${s.patients}</span>
            </div>

            <div class="result">
                <strong>Успешно</strong>
                <span>${s.successful}</span>
            </div>

            <div class="result">
                <strong>Ошибок</strong>
                <span>${s.mistakes}</span>
            </div>

            <div class="result">
                <strong>Заработано</strong>
                <span>${pay} ₽</span>
            </div>

        </div>

        <br>

        <button
            class="primary"
            onclick="closeModal();go('dashboard')"
        >
            Вернуться
        </button>
        `
    );
}

function openPatient(id){

    const p=
        state.queue.find(
            x=>x.uid===id
        );

    if(!p){
        return;
    }

    if(
        p.status==='waiting'||
        p.status==='critical'
    ){

        p.status='active';

        state.shift.patients++;

        if(p.p===1){
            state.stats.emergencies++;
        }
    }

    state.current=id;

    state.screen='patient';

    log(
        p,
        'Пациент принят в работу.',
        'info'
    );

    save();

    render();
}

function current(){

    return state.queue.find(
        p=>p.uid===state.current
    );
}

function log(
    p,
    text,
    type=''
){

    p.log.unshift({

        text:text,

        type:type,

        time:
            new Date()
            .toLocaleTimeString(
                'ru-RU',
                {
                    hour:'2-digit',
                    minute:'2-digit'
                }
            )
    });
}

function vital(a,b,c){

function procedure(type){

    const p=current();

    if(!p){
        return;
    }

    if(
        p.results[type]||
        p.procedureDone[type]
    ){

        return toast(
            'Это действие уже выполнено'
        );
    }

    p.proc={
        type:type,
        step:0,
        mistakes:0
    };

    procedureModal();
}

function procedureModal(){

    const p=current();

    const d=
        procData[p.proc.type];

    const s=
        d.steps[p.proc.step];

    openModal(

        d.title,

        `
        <div class="steps">

            ${
                d.steps.map(
                    (x,i)=>
                    `
                    <div
                        class="step ${
                            i<p.proc.step
                            ?
                            'done'
                            :
                            i===p.proc.step
                            ?
                            'current'
                            :
                            ''
                        }"
                    >
                        ${i+1}. ${x[0]}
                    </div>
                    `
                ).join('')
            }

        </div>

        <div class="result">

            <strong>
                ${s[0]}
            </strong>

            <span>
                ${s[1][0]}
            </span>

        </div>

        <div class="list">

            ${
                s[1].map(
                    (x,i)=>
                    `
                    <button
                        class="choice"
                        onclick="procChoice(${i})"
                    >
                        ${esc(x)}
                    </button>
                    `
                ).join('')
            }

        </div>

        <br>

        <span class="tag">
            Этап
            ${p.proc.step+1}/
            ${d.steps.length}
        </span>

        <span
            class="tag ${
                p.proc.mistakes
                ?
                'red'
                :
                ''
            }"
        >
            Ошибок
            ${p.proc.mistakes}
        </span>
        `
    );
}

function procChoice(i){

    const p=current();

    const d=
        procData[p.proc.type];

    const s=
        d.steps[p.proc.step];

    if(i!==0){

        p.proc.mistakes++;

        p.errors++;

        state.shift.mistakes++;

        state.rep=
            Math.max(
                0,
                state.rep-1
            );

        log(
            p,
            'Ошибка процедуры: '+
            s[1][i],
            'bad'
        );

        toast(
            'Неправильный выбор — этап не пройден'
        );

        save();

        procedureModal();

        return;
    }

    log(
        p,
        'Этап выполнен: '+
        s[0],
        'good'
    );

    p.proc.step++;

    advance(3);

    if(
        p.proc.step<
        d.steps.length
    ){

        procedureModal();

        return;
    }

    const type=
        p.proc.type;

    p.procedureDone[type]=true;

    if(type==='blood'){

        state.stats.blood++;

        p.results.blood=
            p.t.blood||
            'Материал принят лабораторией.';
    }

    if(type==='swab'){

        state.stats.swabs++;

        p.results.swab=
            'Материал принят лабораторией.';
    }

    if(type==='ecg'){

        state.stats.ecg++;

        p.results.ecg=
            p.t.ecg||
            'Синусовый ритм без очевидных острых изменений.';
    }

    if(type==='xray'){

        state.stats.xray++;

        p.results.xray=
            p.t.xray||
            'Без очевидной патологии.';
    }

    if(type==='ultrasound'){

        state.stats.ultrasound++;

        p.results.ultrasound=
            p.t.ultrasound||
            'Без значимых изменений.';
    }

    if(
        type==='wound'||
        type==='burn'
    ){

        state.stats.bandages++;
    }

    p.proc=null;

    xp(12);

    log(
        p,
        'Процедура завершена.',
        'good'
    );

    closeModal();

    render();
}

function finishCase(){

    const p=current();

    const correct=
        p.alts[p.suspect]===p.diag;

    const dest=
        p.dest===p.dep;

    const data=
        p.asked.length>=2&&
        p.exam.length>=2;

    let urgent=true;

    if(p.p===1){

        if(p.caseId==='stroke'){

            urgent=!!p.results.ct;
        }

        if(p.caseId==='mi'){

            urgent=!!p.results.ecg;
        }

        if(p.caseId==='poison'){

            urgent=!!p.results.tox;
        }

        if(p.caseId==='allergy'){

            urgent=p.exam.length>=2;
        }
    }

    const score=
        (correct?50:0)+
        (dest?25:0)+
        (data?15:0)+
        (urgent?10:0);

    const good=
        score>=80;

    if(good){

        state.shift.successful++;

        state.stats.diagnoses++;

        xp(45);

        state.money+=75;

        p.status='done';

        log(
            p,
            'Случай завершён успешно: '+
            score+
            '/100',
            'good'
        );

    }else{

        state.shift.mistakes++;

        state.rep=
            Math.max(
                0,
                state.rep-3
            );

        p.status='needs_review';

        log(
            p,
            'Случай завершён с ошибками: '+
            score+
            '/100',
            'bad'
        );
    }

    save();

    openModal(

        '📋 Итог случая',

        `
        <div class="result">

            <strong>
                Оценка
            </strong>

            <span>
                ${score}/100
            </span>

        </div>

        <div class="result">

            <strong>
                Диагноз
            </strong>

            <span>
                ${
                    correct
                    ?
                    '✓ Верно'
                    :
                    '✕ Ошибка'
                }

                —
                ${esc(p.diag)}

            </span>

        </div>

        <div class="result">

            <strong>
                Направление
            </strong>

            <span>
                ${
                    dest
                    ?
                    '✓ Соответствует'
                    :
                    '✕ Требует пересмотра'
                }
            </span>

        </div>

        <div class="result">

            <strong>
                Экстренная готовность
            </strong>

            <span>
                ${
                    urgent
                    ?
                    '✓ Выполнено'
                    :
                    '✕ Не выполнен необходимый этап'
                }
            </span>

        </div>

        <br>

        <button
            class="primary"
            onclick="closeModal();go('queue')"
        >
            Вернуться к пациентам
        </button>
        `
    );
}

                </span>

            </div>

            <div class="result">

                <strong>
                    Репутация
                </strong>

                <span>
                    ${state.rep}/100
                </span>

            </div>

        </div>

        <div class="card">

            <h3>
                🧑‍⚕️ Профессия
            </h3>

            <div
                class="list"
                style="margin-top:12px"
            >

                ${
                    Object.entries(
                        professions
                    ).map(
                        ([id,p])=>
                        `
                        <button
                            class="choice"
                            onclick="changeProf('${id}')"
                            style="
                                border-color:
                                ${
                                    id===state.profession
                                    ?
                                    '#3de0d4'
                                    :
                                    ''
                                }
                            "
                        >

                            ${p.icon}

                            <b>
                                ${p.name}
                            </b>

                            <br>

                            <small class="muted">
                                Базовая зарплата
                                ${p.salary} ₽
                            </small>

                        </button>
                        `
                    ).join('')
                }

            </div>

        </div>

    </div>
    `;
}

function changeProf(id){

    if(state.shift.active){

        return toast(
            'Профессию можно менять между сменами'
        );
    }

    state.profession=id;

    save();

    render();

    toast(
        'Профессия изменена'
    );
}

function settings(){

    return`

    <div class="grid g2">

        <div class="card">

            <h3>
                🎵 Музыка
            </h3>

            <p
                class="muted"
                style="margin:8px 0 13px"
            >
                Положи файл
                <b>med.mp3</b>
                рядом с index.html.
            </p>

            <button
                class="btn"
                onclick="music()"
            >
                ${
                    state.music
                    ?
                    '⏸ Выключить'
                    :
                    '▶ Включить'
                }
                музыку
            </button>

        </div>

        <div class="card">

            <h3>
                💾 Прогресс
            </h3>

            <p
                class="muted"
                style="margin:8px 0 13px"
            >
                Сохранение работает через
                localStorage.
            </p>

            <button
                class="btn red"
                onclick="resetGame()"
            >
                Сбросить прогресс
            </button>

        </div>

    </div>
    `;
}

async function music(){

    const m=$('music');

    try{

        if(m.paused){

            await m.play();

            state.music=true;

        }else{

            m.pause();

            state.music=false;
        }

        save();

        render();

    }catch(e){

        toast(
            'Нажми кнопку ещё раз для запуска музыки'
        );
    }
}

function resetGame(){

    if(
        confirm(
            'Удалить весь прогресс?'
        )
    ){

        localStorage.removeItem(
            SAVE
        );

        location.reload();
    }
}

document.addEventListener(
    'keydown',
    e=>{

        if(e.key==='Escape'){
            closeModal();
        }

    }
);

load();

render();

</script>
</body>
</html>
