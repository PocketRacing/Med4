<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#08111f">
<title>MED SHIFT — REMAKE 1.0</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#060b14;
    --panel:#0d1624;
    --panel2:#111d2d;
    --panel3:#172438;
    --line:#263850;
    --text:#edf5ff;
    --muted:#8192aa;
    --blue:#49a6ff;
    --cyan:#42e8e0;
    --green:#43d17b;
    --yellow:#ffd45c;
    --orange:#ff9e4a;
    --red:#ff5c67;
    --purple:#ad7aff;
    --shadow:0 18px 60px rgba(0,0,0,.35);
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 20% 0%,rgba(40,110,180,.16),transparent 35%),
        radial-gradient(circle at 90% 20%,rgba(80,30,160,.12),transparent 30%),
        var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

button,
select,
input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

#app{
    min-height:100vh;
}

/* LOGIN */

.login{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.login-card{
    width:min(680px,100%);
    background:linear-gradient(145deg,#101d2e,#09121e);
    border:1px solid var(--line);
    border-radius:28px;
    box-shadow:var(--shadow);
    padding:35px;
}

.logo{
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom:25px;
}

.logo-icon{
    width:70px;
    height:70px;
    border-radius:22px;
    display:grid;
    place-items:center;
    font-size:36px;
    background:linear-gradient(145deg,#1677c9,#36d4d1);
    box-shadow:0 12px 35px rgba(30,170,230,.25);
}

.logo h1{
    font-size:30px;
    letter-spacing:2px;
}

.logo p{
    color:var(--muted);
    margin-top:5px;
}

.login-text{
    color:#b8c6d9;
    line-height:1.6;
    margin-bottom:25px;
}

.name-input{
    width:100%;
    padding:17px;
    border-radius:14px;
    border:1px solid var(--line);
    background:#08111d;
    color:white;
    outline:none;
    margin-bottom:15px;
}

.primary{
    width:100%;
    padding:16px;
    border-radius:14px;
    background:linear-gradient(135deg,#278ff0,#35c9c0);
    color:white;
    font-weight:800;
}

.primary:hover{
    filter:brightness(1.1);
}

/* MAIN */

.shell{
    display:grid;
    grid-template-columns:250px 1fr;
    min-height:100vh;
}

.sidebar{
    position:sticky;
    top:0;
    height:100vh;
    background:rgba(8,15,25,.94);
    border-right:1px solid var(--line);
    padding:18px;
    display:flex;
    flex-direction:column;
}

.side-brand{
    padding:10px;
    margin-bottom:20px;
}

.side-brand strong{
    font-size:19px;
}

.side-brand span{
    display:block;
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.nav{
    display:grid;
    gap:8px;
}

.nav button{
    text-align:left;
    padding:13px 14px;
    border-radius:12px;
    color:#aabbd0;
    background:transparent;
}

.nav button:hover,
.nav button.active{
    color:white;
    background:#15253a;
}

.profile-mini{
    margin-top:auto;
    background:#0d1827;
    border:1px solid var(--line);
    padding:14px;
    border-radius:16px;
}

.profile-mini b{
    display:block;
}

.profile-mini small{
    color:var(--muted);
}

.main{
    min-width:0;
    padding:20px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.top-left h2{
    font-size:25px;
}

.top-left p{
    color:var(--muted);
    margin-top:4px;
}

.top-stats{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
}

.stat{
    padding:10px 13px;
    border:1px solid var(--line);
    background:#0c1725;
    border-radius:12px;
}

.stat span{
    color:var(--muted);
    font-size:11px;
    display:block;
}

.stat b{
    font-size:15px;
}

/* CARDS */

.grid{
    display:grid;
    gap:15px;
}

.grid-2{
    grid-template-columns:repeat(2,minmax(0,1fr));
}

.grid-3{
    grid-template-columns:repeat(3,minmax(0,1fr));
}

.card{
    background:linear-gradient(145deg,rgba(16,29,46,.98),rgba(9,17,28,.98));
    border:1px solid var(--line);
    border-radius:18px;
    padding:18px;
    box-shadow:0 10px 35px rgba(0,0,0,.15);
}

.card-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:15px;
}

.card-title h3{
    font-size:17px;
}

.muted{
    color:var(--muted);
}

.big-number{
    font-size:30px;
    font-weight:900;
}

.progress{
    height:7px;
    border-radius:99px;
    overflow:hidden;
    background:#07101b;
    margin-top:10px;
}

.progress div{
    height:100%;
    background:linear-gradient(90deg,var(--blue),var(--cyan));
}

/* DASHBOARD */

.hero{
    padding:25px;
    border-radius:22px;
    background:
        linear-gradient(135deg,rgba(25,87,145,.42),rgba(20,35,58,.8)),
        radial-gradient(circle at 90% 20%,rgba(55,224,215,.18),transparent 35%);
    border:1px solid #315271;
    margin-bottom:15px;
}

.hero h1{
    font-size:30px;
}

.hero p{
    color:#adc1d9;
    margin-top:8px;
    line-height:1.5;
}

.action{
    padding:12px 15px;
    border-radius:12px;
    background:#16263b;
    color:white;
    border:1px solid #2a415e;
}

.action:hover{
    background:#1d3550;
}

.action.green{
    background:rgba(67,209,123,.13);
    border-color:rgba(67,209,123,.35);
}

.action.red{
    background:rgba(255,92,103,.13);
    border-color:rgba(255,92,103,.35);
}

.action.blue{
    background:rgba(73,166,255,.14);
    border-color:rgba(73,166,255,.35);
}

.action.orange{
    background:rgba(255,158,74,.14);
    border-color:rgba(255,158,74,.35);
}

.action:disabled{
    opacity:.35;
    cursor:not-allowed;
}

.tags{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.tag{
    padding:5px 9px;
    border-radius:99px;
    font-size:11px;
    background:#17263a;
    color:#a9bdd5;
    border:1px solid #263c57;
}

.tag.red{
    color:#ff8e96;
    border-color:#66323a;
    background:#29171c;
}

.tag.green{
    color:#7ee7a6;
    border-color:#295d41;
    background:#12271c;
}

.tag.yellow{
    color:#ffe18a;
    border-color:#665728;
    background:#2b2512;
}

/* PATIENT QUEUE */

.patient-list{
    display:grid;
    gap:10px;
}

.patient-row{
    width:100%;
    text-align:left;
    display:grid;
    grid-template-columns:48px 1fr auto;
    align-items:center;
    gap:12px;
    padding:13px;
    border-radius:14px;
    border:1px solid var(--line);
    background:#0b1523;
    color:white;
}

.patient-row:hover{
    border-color:#3a5879;
    background:#111f31;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:13px;
    display:grid;
    place-items:center;
    background:#172a42;
    font-size:22px;
}

.patient-row strong{
    display:block;
}

.patient-row small{
    color:var(--muted);
}

.priority{
    min-width:65px;
    text-align:center;
    padding:6px 8px;
    border-radius:9px;
    font-size:11px;
    font-weight:800;
}

.p1{
    background:#4b151d;
    color:#ff818b;
}

.p2{
    background:#493414;
    color:#ffd06a;
}

.p3{
    background:#173d2a;
    color:#7ee6a2;
}

/* PATIENT SCREEN */

.patient-layout{
    display:grid;
    grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);
    gap:15px;
}

.patient-header{
    display:flex;
    gap:15px;
    align-items:center;
}

.patient-face{
    width:70px;
    height:70px;
    border-radius:20px;
    display:grid;
    place-items:center;
    font-size:34px;
    background:#162942;
}

.patient-name{
    font-size:23px;
    font-weight:900;
}

.patient-meta{
    color:var(--muted);
    margin-top:4px;
}

.complaint{
    margin-top:18px;
    padding:15px;
    border-radius:14px;
    background:#0b1624;
    border:1px solid #21344c;
    line-height:1.5;
}

.vitals{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
}

.vital{
    padding:13px;
    border-radius:13px;
    background:#0a1421;
    border:1px solid var(--line);
}

.vital small{
    color:var(--muted);
    display:block;
}

.vital b{
    display:block;
    margin-top:5px;
    font-size:18px;
}

.vital.danger b{
    color:var(--red);
}

.vital.warning b{
    color:var(--yellow);
}

.section{
    margin-top:18px;
}

.section h4{
    color:#c4d2e2;
    margin-bottom:10px;
}

/* ACTIONS */

.action-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.action-grid button{
    min-height:55px;
}

.log{
    height:270px;
    overflow:auto;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.log-entry{
    padding:10px;
    border-radius:10px;
    background:#0a1420;
    color:#aebfd3;
    font-size:12px;
    line-height:1.45;
    border-left:3px solid #29435e;
}

.log-entry.good{
    border-left-color:var(--green);
}

.log-entry.bad{
    border-left-color:var(--red);
}

.log-entry.info{
    border-left-color:var(--blue);
}

/* QUESTIONS */

.question-list{
    display:grid;
    gap:8px;
}

.question{
    width:100%;
    text-align:left;
    padding:12px;
    background:#0b1624;
    border:1px solid var(--line);
    border-radius:12px;
    color:#c9d7e8;
}

.question:hover{
    border-color:#426181;
}

.question.asked{
    opacity:.5;
}

/* PROCEDURE */

.stepper{
    display:flex;
    gap:5px;
    overflow:auto;
    margin-bottom:18px;
}

.step{
    flex:1;
    min-width:90px;
    padding:10px;
    text-align:center;
    border-radius:10px;
    background:#0a1420;
    color:#70839b;
    border:1px solid var(--line);
    font-size:11px;
}

.step.done{
    color:#8ce7ad;
    border-color:#2d6646;
}

.step.current{
    color:white;
    border-color:#398bd2;
    background:#10243a;
}

.procedure-zone{
    min-height:240px;
    display:grid;
    place-items:center;
    border:1px dashed #38536f;
    border-radius:16px;
    background:
        radial-gradient(circle,rgba(62,148,224,.08),transparent 50%),
        #08121e;
    padding:25px;
    text-align:center;
}

.procedure-controls{
    margin-top:15px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
}

.choice-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
    width:100%;
    max-width:650px;
}

.choice{
    padding:14px;
    border-radius:12px;
    background:#101f31;
    border:1px solid #29405b;
    color:#d9e6f5;
}

.choice:hover{
    border-color:#51a9ed;
}

.choice.selected{
    border-color:var(--cyan);
    background:#123438;
}

/* RESULTS */

.result{
    padding:13px;
    border-radius:12px;
    background:#0a1522;
    border:1px solid var(--line);
    margin-bottom:8px;
}

.result strong{
    display:block;
    margin-bottom:5px;
}

.result span{
    color:#afc0d4;
    font-size:13px;
}

.diagnosis-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.diag{
    text-align:left;
    padding:14px;
    border-radius:13px;
    background:#0b1624;
    border:1px solid var(--line);
    color:#dbe8f5;
}

.diag:hover{
    border-color:#4c9cda;
}

.diag.selected{
    border-color:var(--cyan);
    background:#103236;
}

/* SHIFT */

.shift-box{
    padding:25px;
    text-align:center;
}

.shift-time{
    font-size:50px;
    font-weight:900;
    letter-spacing:3px;
}

.clockbar{
    height:10px;
    background:#07101a;
    border-radius:99px;
    overflow:hidden;
    margin:20px 0;
}

.clockbar div{
    height:100%;
    background:linear-gradient(90deg,var(--blue),var(--purple));
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    place-items:center;
    padding:20px;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(8px);
}

.modal.show{
    display:grid;
}

.modal-card{
    width:min(700px,100%);
    max-height:90vh;
    overflow:auto;
    background:#0d1827;
    border:1px solid #30445e;
    border-radius:22px;
    padding:22px;
    box-shadow:var(--shadow);
}

.modal-title{
    display:flex;
    justify-content:space-between;
    gap:15px;
    margin-bottom:18px;
}

.close{
    width:35px;
    height:35px;
    border-radius:10px;
    background:#18273a;
    color:white;
}

/* TOAST */

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:200;
    width:min(390px,calc(100% - 40px));
    padding:15px;
    border-radius:14px;
    background:#111e2e;
    border:1px solid #3a506d;
    box-shadow:var(--shadow);
    transform:translateY(120px);
    opacity:0;
    transition:.3s;
}

.toast.show{
    transform:translateY(0);
    opacity:1;
}

/* MOBILE */

@media(max-width:950px){
    .shell{
        grid-template-columns:1fr;
    }

    .sidebar{
        position:fixed;
        z-index:50;
        left:0;
        right:0;
        bottom:0;
        top:auto;
        height:auto;
        padding:8px;
        border-right:0;
        border-top:1px solid var(--line);
    }

    .side-brand,
    .profile-mini{
        display:none;
    }

    .nav{
        display:grid;
        grid-template-columns:repeat(5,1fr);
    }

    .nav button{
        text-align:center;
        padding:10px 3px;
        font-size:11px;
    }

    .main{
        padding:13px 13px 90px;
    }

    .patient-layout,
    .grid-2,
    .grid-3{
        grid-template-columns:1fr;
    }

    .topbar{
        align-items:flex-start;
        flex-direction:column;
    }
}

@media(max-width:600px){
    .login-card{
        padding:23px;
        border-radius:20px;
    }

    .logo h1{
        font-size:24px;
    }

    .hero h1{
        font-size:24px;
    }

    .vitals{
        grid-template-columns:repeat(2,1fr);
    }

    .diagnosis-grid,
    .choice-grid{
        grid-template-columns:1fr;
    }

    .patient-row{
        grid-template-columns:42px 1fr;
    }

    .patient-row .priority{
        grid-column:2;
        justify-self:start;
    }

    .shift-time{
        font-size:38px;
    }
}
</style>
</head>

<body>

<div id="app"></div>

<div id="modal" class="modal">

        </div>
        <div id="modalBody"></div>
    </div>
</div>

<div id="toast" class="toast"></div>

<audio id="music" src="med.mp3" loop></audio>

/* =========================================================
   SAVE / LOAD
   ========================================================= */

function save(){
    localStorage.setItem(SAVE_KEY,JSON.stringify(state));
}

function load(){
    try{
        const data=JSON.parse(localStorage.getItem(SAVE_KEY));
        if(data) state=Object.assign(state,data);
    }catch(e){}
}

function resetGame(){
    if(!confirm("Удалить весь прогресс?")) return;
    localStorage.removeItem(SAVE_KEY);
    location.reload();
}

/* =========================================================
   UTILS
   ========================================================= */

function uid(){
    return Math.random().toString(36).slice(2)+Date.now();
}

function xpNeed(){
    return 100+(state.level-1)*75;
}

function addXP(amount){
    state.xp+=amount;

    while(state.xp>=xpNeed()){
        state.xp-=xpNeed();
        state.level++;
        toast("Новый уровень: "+state.level+" ⭐");
    }

    save();
}

function toast(text,type=""){
    const el=$("toast");
    el.textContent=text;
    el.className="toast show "+type;

    clearTimeout(window.toastTimer);

    window.toastTimer=setTimeout(()=>{
        el.className="toast";
    },2800);
}

function openModal(title,body){
    $("modalTitle").textContent=title;
    $("modalBody").innerHTML=body;
    $("modal").classList.add("show");
}

function closeModal(){
    $("modal").classList.remove("show");
}

function esc(s){
    return String(s)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;");
}

/* =========================================================
   PATIENT GENERATION
   ========================================================= */

function createPatient(template){
    return {
        uid:uid(),
        caseId:template.id,

        name:template.name,
        age:template.age,
        sex:template.sex,
        icon:template.icon,

        priority:template.priority,
        department:template.department,

        complaint:template.complaint,
        diagnosis:template.hiddenDiagnosis,
        alternatives:[...template.alternatives],

        vitals:{...template.vitals},
        history:[...template.history],
        exam:[...template.exam],
        tests:{...template.tests},

        asked:[],
        examined:[],
        results:{},

        procedures:{
            blood:false,
            swab:false,
            ecg:false,
            xray:false,
            ultrasound:false,
            wound:false,
            burn:false
        },

        triage:null,
        suspected:null,
        destination:null,

        procedure:null,

        errors:0,
        deterioration:0,

        status:"waiting",
        startedAt:Date.now()
    };
}

function generateQueue(){
    const shuffled=[...CASES].sort(()=>Math.random()-.5);

    state.queue=shuffled.slice(0,6).map(createPatient);

    state.queue.sort((a,b)=>a.priority-b.priority);
}

/* =========================================================
   SHIFT
   ========================================================= */

function startShift(){
    if(state.shift.active){
        toast("Смена уже идёт");
        return;
    }

    generateQueue();

    state.shift={
        active:true,
        minute:0,
        max:480,
        patients:0,
        successful:0,
        mistakes:0
    };

    state.current=null;
    state.screen="queue";

    toast("Смена началась. В приёмном отделении пациенты.");
    save();
    render();
}

function endShift(){
    state.shift.active=false;

    const s=state.shift;

    const base=300+state.level*50;
    const bonus=s.successful*75;
    const penalty=s.mistakes*35;

    const salary=Math.max(0,base+bonus-penalty);

    state.money+=salary;

    openModal(
        "Смена завершена",
        `
        <div class="grid grid-2">
            <div class="result">
                <strong>Пациенты</strong>
                <span>${s.patients}</span>
            </div>
            <div class="result">
                <strong>Успешно</strong>
                <span>${s.successful}</span>
            </div>
            <div class="result">
                <strong>Ошибки</strong>
                <span>${s.mistakes}</span>
            </div>
            <div class="result">
                <strong>Заработано</strong>
                <span>${salary} ₽</span>
            </div>
        </div>

        <br>

        <button class="primary" onclick="closeModal();go('dashboard')">
            Вернуться в больницу
        </button>
        `
    );

    save();
}

/* Simulated shift clock: advances when meaningful actions occur */
function advanceShift(minutes){
    if(!state.shift.active) return;

    state.shift.minute+=minutes;

    checkDeterioration();

    if(state.shift.minute>=state.shift.max){
        state.shift.minute=state.shift.max;
        endShift();
    }

    save();
}

function checkDeterioration(){
    state.queue.forEach(p=>{
        if(p.status==="waiting" && p.priority===1){
            p.deterioration++;

            if(p.deterioration>=4){
                p.status="critical";
                toast(p.name+" нуждается в срочной помощи!","bad");
            }
        }
    });
}

function openPatient(id){

    const p=state.queue.find(x=>x.uid===id);

    if(!p) return;

    state.current=id;

    if(p.status==="waiting"){
        p.status="active";
        state.shift.patients++;
    }

    state.screen="patient";

    addLog(p,"Пациент принят в работу.","info");

    save();
    render();
}

function currentPatient(){
    return state.queue.find(p=>p.uid===state.current);
}

function addLog(p,text,type=""){
    if(!p.log) p.log=[];
    p.log.unshift({
        text,
        type,
        time:new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})
    });
}

function renderPatient(){

    const p=currentPatient();

function vital(name,value,cl=""){
    return `
        <div class="vital ${cl}">
            <small>${name}</small>
            <b>${value}</b>
        </div>
    `;
}

function pressureClass(p){
    const x=Number(p.vitals.bp.split("/")[0]);
    if(x<90||x>180)return"danger";
    if(x<100||x>160)return"warning";
    return"";
}

function consciousnessText(p){
    if(p.id==="poison" && p.deterioration>3) return"Угнетено";
    return"Ясное";
}

function departmentName(id){
    const d=DB.departments.find(x=>x[0]===id);
    return d?d[2]+" "+d[1]:id;
}

/* =========================================================
   HISTORY / EXAM
   ========================================================= */

function askHistory(index){

    const p=currentPatient();

    if(!p||p.asked.includes(index))return;

    p.asked.push(index);

    const item=p.history[index];

    addLog(
        p,
        "Анамнез: "+item[0]+" — "+item[1],
        "info"
    );

    advanceShift(3);

    render();
}

function performExam(index){

    const p=currentPatient();

    if(!p||p.examined.includes(index))return;

    p.examined.push(index);

    const item=p.exam[index];

    state.stats.examinations++;

    addLog(
        p,
        "Осмотр: "+item[0]+" — "+item[1],
        "good"
    );

    advanceShift(2);

    render();
}

function setTriage(value){

    const p=currentPatient();

    p.triage=value;

    if(value!==p.priority){

        p.errors++;

        state.shift.mistakes++;
        state.reputation=Math.max(0,state.reputation-2);

        addLog(
            p,
            "Приоритет определён неправильно.",
            "bad"
        );

        toast("Триаж требует пересмотра","bad");

    }else{

        addXP(10);

        addLog(
            p,
            "Приоритет определён правильно: P"+value,
            "good"
        );

        toast("Триаж выполнен правильно");
    }

    advanceShift(2);

    closeModal();
    render();
}

function startProcedure(type){

    const p=currentPatient();

    if(!p)return;

    if(type==="blood" && p.procedures.blood){
        toast("Кровь уже была взята");
        return;
    }

    if(type==="ecg" && p.procedures.ecg){
        toast("ЭКГ уже выполнена");
        return;
    }

    p.procedure={
        type,
        step:0,
        mistakes:0,
        selected:null
    };

    openProcedureModal();

}

function openProcedureModal(){

    const p=currentPatient();
    const proc=PROCEDURES[p.procedure.type];

    const step=proc.steps[p.procedure.step];

    openModal(
        proc.title,
        renderProcedureStep(proc,step,p.procedure)
    );
}

function renderProcedureStep(proc,step,progress){

    return `

        <div class="stepper">

            ${
                proc.steps.map((x,i)=>`

                    <div class="step ${
                        i<progress.step?"done":
                        i===progress.step?"current":""
                    }">
                        ${i+1}. ${x.title}
                    </div>

                `).join("")
            }

        </div>

        <div class="procedure-zone">

            <div style="width:100%">

                <div style="font-size:45px;margin-bottom:10px">
                    🩺
                </div>

                <h3>${step.title}</h3>

                <p class="muted" style="margin-top:8px">
                    ${step.text}
                </p>

                <br>

                <div class="choice-grid">

                    ${
                        step.choices.map((c,i)=>`

                            <button class="choice"
                                onclick="procedureChoice(${i})">
                                ${esc(c[0])}
                            </button>

                        `).join("")
                    }

                </div>

            </div>

        </div>

        <br>

        <div class="tags">
            <span class="tag">
                Этап ${progress.step+1}/${proc.steps.length}
            </span>

            <span class="tag ${
                progress.mistakes?"red":"green"
            }">
                Ошибок: ${progress.mistakes}
            </span>
        </div>

    `;
}

function procedureChoice(index){

    const p=currentPatient();

    if(!p||!p.procedure)return;

    const proc=PROCEDURES[p.procedure.type];
    const step=proc.steps[p.procedure.step];
    const choice=step.choices[index];

    if(!choice[1]){

        p.procedure.mistakes++;
        p.errors++;

        state.shift.mistakes++;
        state.reputation=Math.max(0,state.reputation-1);

        addLog(
            p,
            "Ошибка во время процедуры: "+choice[0],
            "bad"
        );

        toast("Неправильный этап. Процедура не завершена.","bad");

        save();
        openProcedureModal();
        return;
    }

    addLog(
        p,
        "Этап выполнен: "+step.title,
        "good"
    );

    p.procedure.step++;

    advanceShift(3);

    if(p.procedure.step>=proc.steps.length){

        finishProcedure();

    }else{

        save();
        openProcedureModal();

    }
}

function finishProcedure(){

    const p=currentPatient();
    const type=p.procedure.type;

    p.procedures[type]=true;

    if(type==="blood"){
        state.stats.blood++;
        p.results.blood=p.tests.blood||"Материал получен. Существенных отклонений не выявлено.";
    }

    if(type==="swab"){
        state.stats.swabs++;
        p.results.swab="Материал принят лабораторией. Результат добавлен в карту.";
    }

    if(type==="ecg"){
        state.stats.ecg++;
        p.results.ecg=p.tests.ecg||"Синусовый ритм без очевидных острых изменений.";
    }

    if(type==="xray"){
        state.stats.xray++;
        p.results.xray=p.tests.xray||"Без очевидной патологии.";
    }

    if(type==="ultrasound"){
        state.stats.ultrasound++;
        p.results.ultrasound=p.tests.ultrasound||"Без значимых изменений.";
    }

    if(type==="wound"){
        state.stats.bandages++;
    }

    if(type==="burn"){
        state.stats.bandages++;
    }

    addXP(12);

    addLog(
        p,
        "Процедура завершена: "+PROCEDURES[type].title,
        "good"
    );

    p.procedure=null;

    toast("Процедура выполнена");

    closeModal();
    save();
    render();
}

function chooseDestination(destination){

    const p=currentPatient();

    if(!p)return;

    p.destination=destination;

    addLog(
        p,
        "Выбрано направление: "+departmentName(destination),
        "info"
    );

    closeModal();

    finalDecision();

}

function finalDecision(){

    const p=currentPatient();

    if(!p||p.suspected===null||p.destination===null){

        toast("Нужно выбрать гипотезу и направление","bad");
        return;
    }

    const selected=p.alternatives[p.suspected];

    let correctDiagnosis=selected===p.diagnosis;

    let correctDestination=p.destination===p.department;

    let dataQuality=
        p.asked.length>=2 &&
        p.examined.length>=2;

    let emergencyReady=true;

    if(p.priority===1){

        if(p.id==="stroke"){
            emergencyReady=
                !!p.results.ct;
        }

        if(p.id==="mi"){
            emergencyReady=
                !!p.results.ecg;
        }

        if(p.id==="allergy"){
            emergencyReady=
                p.examined.length>=3;
        }

        if(p.id==="poison"){
            emergencyReady=
                !!p.results.tox;
        }
    }

    let score=0;

    if(correctDiagnosis) score+=50;
    if(correctDestination) score+=25;
    if(dataQuality) score+=15;
    if(emergencyReady) score+=10;

    const good=score>=80;

    if(good){

        state.shift.successful++;
        state.stats.diagnoses++;

        addXP(45);
        state.money+=75;

        addLog(
            p,
            "Случай завершён успешно. Итоговая оценка: "+score+"/100.",
            "good"
        );

        p.status="done";

        toast("Случай завершён успешно! +XP");

        showCaseResult(
            p,
            score,
            correctDiagnosis,
            correctDestination,
            emergencyReady
        );

    }else{

        p.errors++;

        state.shift.mistakes++;

        state.reputation=Math.max(
            0,
            state.reputation-(correctDiagnosis?2:5)
        );

        p.status="needs_review";

        addLog(
            p,
            "Случай завершён с ошибками. Итоговая оценка: "+score+"/100.",
            "bad"
        );

        showCaseResult(
            p,
            score,
            correctDiagnosis,
            correctDestination,
            emergencyReady
        );
    }

    save();
}

function showCaseResult(
    p,
    score,
    correctDiagnosis,
    correctDestination,
    emergencyReady
){

    openModal(
        "📋 Итог случая",
        `

        <div class="result">
            <strong>Результат</strong>
            <span>${score}/100</span>
        </div>

        <div class="result">
            <strong>Рабочая гипотеза</strong>
            <span>

            </span>
        </div>

        <div class="result">
            <strong>Направление</strong>
            <span>
                ${correctDestination?"✓ Подходит":"✕ Требует пересмотра"}
            </span>
        </div>

        <div class="result">
            <strong>Экстренная готовность</strong>
            <span>
                ${emergencyReady?"✓ Достаточно":"✕ Не выполнены необходимые действия"}
            </span>
        </div>

        <br>

        <div class="result">

function leavePatient(){

    const p=currentPatient();

    if(p){

        if(p.priority===1 && p.status==="active"){

            p.errors++;
            state.shift.mistakes++;

            state.reputation=Math.max(
                0,
                state.reputation-3
            );

            addLog(
                p,
                "Пациент оставлен без завершения работы.",
                "bad"
            );
        }

        p.status="waiting";
    }

    state.current=null;
    state.screen="queue";

    save();
    render();
}

    </div>

    `;
}

function changeProfession(id){

    if(state.shift.active){
        toast("Профессию можно менять между сменами","bad");
        return;
    }

    state.profession=id;

    save();
    render();

    toast("Профессия изменена");
}

/* =========================================================
   MUSIC
   ========================================================= */

async function toggleMusic(){

    const music=$("music");

    try{

        if(music.paused){

            await music.play();

            state.music=true;
            toast("Музыка включена");

        }else{

            music.pause();

            state.music=false;
            toast("Музыка выключена");

        }

    }catch(e){

        toast("Браузер заблокировал автозапуск. Нажми ещё раз.");

    }

    save();
    render();
}

document.addEventListener("keydown",e=>{

    if(e.key==="Escape"){
        closeModal();
    }

});

function testName(k){

    const names={
        blood:"Общий анализ крови",
        glucose:"Глюкоза",
        ecg:"ЭКГ",
        xray:"Рентген",
        ultrasound:"УЗИ",
        tox:"Токсикологическое исследование",
        ct:"КТ головного мозга",
        swab:"Мазок"
    };

    return names[k]||k;
}

/* =========================================================
   QUICK ACTIONS
   ========================================================= */

/*
   These actions deliberately don't instantly give a result.
   They represent decisions that must be made from the patient data.
*/

function oxygenCheck(){

    const p=currentPatient();

    if(!p)return;

    if(p.vitals.spo2<94){

        addLog(
            p,
            "Обнаружена сниженная сатурация — требуется внимание к дыханию.",
            "info"
        );

        addXP(5);

    }else{

        addLog(
            p,
            "SpO₂ находится без выраженного снижения.",
            "info"
        );
    }

    advanceShift(1);
    render();
}

/* =========================================================
   INITIALIZATION
   ========================================================= */

load();

if(state.shift &&
   state.shift.active &&
   state.shift.minute>=state.shift.max){

    state.shift.active=false;
}

render();

document.addEventListener("click",function(){

    if(

        localStorage.getItem("med_music_attempt")
    ){

    }

},{once:true});
